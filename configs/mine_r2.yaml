# Hard-sample mining round 2: re-tier a 20k-bundle training subset with the {m1, m2, m3} ensemble.
data_dir: data/processed
subset: train
max_samples: 20000
checkpoints:
  - runs/m1_scratch/checkpoint_last.pt
  - runs/m2_warm_uniform/checkpoint_best.pt
  - runs/m3_hardmine_r1/checkpoint_best.pt
num_steps: 5
sigma_min: 0.003
sigma_max: 0.15
gate_threshold: 0.40
scale_calibration: true
easy_threshold: 0.008
hard_threshold: 0.015
output: runs/mining/tiers_r2.json
