# Ensemble member 4: warm-started from member 3, tier-weighted sampling from mining round 2;
# untiered bundles stay reachable. Ensemble uses runs/m4_hardmine_r2/checkpoint_last.pt.
data_dir: data/processed
output_dir: runs/m4_hardmine_r2
init_checkpoint: runs/m3_hardmine_r1/checkpoint_best.pt
tier_file: runs/mining/tiers_r2.json
tier_weights: [1.0, 2.0, 5.0, 1.0]
sigma_min: 0.001
sigma_max: 0.2
sigma_sampling: uniform
feature_aug_std: 0.01
lr: 1.0e-4
weight_decay: 1.0e-4
max_grad_norm: 0.5
epochs: 12
samples_per_epoch: 2048
val_samples_per_epoch: 128
early_stop_patience: 4
early_stop_min_delta: 2.0e-4
seed: 42
